[package]
name = "aomori"
version = "0.1.0"
edition = "2021"
description = "Single-node deterministic MUD world MVP with Lua scripts"

[dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
mlua = { version = "0.11", features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
