global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: aomori
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ['127.0.0.1:8091']
# Add an authenticated Alertmanager endpoint and receiver routing to deliver
# notifications. Without Alertmanager these rules are visible, not delivered.
