name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo check --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: git diff --check

  web:
    name: Web build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run Web E2E
        id: web-e2e
        continue-on-error: true
        run: npm run test:e2e -- --reporter=json
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
      - name: Publish Web E2E summary
        if: always()
        run: |
          if [ -f web/test-results/results.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('web/test-results/results.json', 'utf8'));
            const failed = [];
            for (const suite of report.suites ?? []) {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests ?? []) {
                  for (const result of test.results ?? []) {
                    if (result.status === 'failed' || result.status === 'timedOut') {
                      failed.push({ title: spec.title, file: spec.file, status: result.status, error: result.error?.message ?? '' });
                    }
                  }
                }
              }
            }
            console.log(`## Web E2E\n\n- Expected: ${report.stats.expected}\n- Unexpected: ${report.stats.unexpected}\n- Flaky: ${report.stats.flaky}\n`);
            if (failed.length) console.log('### Failures\n\n```json\n' + JSON.stringify(failed, null, 2) + '\n```');
            NODE
          else
            echo '## Web E2E' >> "$GITHUB_STEP_SUMMARY"
            echo 'Playwright did not produce a JSON report.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Web E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results/
          if-no-files-found: ignore
      - name: Fail if Web E2E failed
        if: steps.web-e2e.outcome == 'failure'
        run: exit 1

  rpc-smoke:
    name: RPC smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: ./scripts/rpc-smoke.sh

  docker:
    name: Docker smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: AOMORI_SMOKE_PORT=28091 ./scripts/docker-smoke.sh
