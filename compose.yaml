services:
  aomori:
    build:
      context: .
    image: aomori:local
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${AOMORI_PUBLISH_ADDRESS:-127.0.0.1}:${AOMORI_PORT:-8091}:8091"
    environment:
      AOMORI_ADMIN_TOKEN: "${AOMORI_ADMIN_TOKEN:?set AOMORI_ADMIN_TOKEN in .env}"
      AOMORI_CORS_ORIGINS: "${AOMORI_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}"
      AOMORI_RPC_RATE_LIMIT: "${AOMORI_RPC_RATE_LIMIT:-100}"
    volumes:
      - aomori-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8091/ready"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  aomori-data:
